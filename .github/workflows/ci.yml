name: GoPlant CI

on:
  push:
    branches: [main, develop1, develop2, develop3]
  pull_request:
    branches: [main, develop1, develop2, develop3]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test (Java 21 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven test suite
        run: mvn -B test

  frontend-check:
    name: Frontend Test & Typecheck (Expo + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GOPLANTT
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: GOPLANTT/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Expo ESLint (advisory)
        continue-on-error: true
        run: npm run lint
