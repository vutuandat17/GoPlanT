sonar.projectKey=goplant
sonar.projectName=GoPlanT
sonar.sourceEncoding=UTF-8

# Analyze application code in the React Native/Expo frontend and Spring backend.
sonar.sources=GOPLANTT/src,backend/src/main/java
sonar.tests=backend/src/test/java,GOPLANTT/src/features/preferences
sonar.test.inclusions=**/*Test.java,**/*.test.mjs,**/*.spec.js,**/*.spec.ts,**/*.spec.tsx

# Maven verify runs before the analysis stage and creates these class folders.
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Do not analyze installed packages, generated output, app assets, or the backup project.
sonar.exclusions=**/node_modules/**,**/.expo/**,**/dist/**,**/build/**,**/target/**,GOPLANTT/assets/**,GOPLANTT/design-reference/**
