spring:
  application:
    name: goplant-backend
  config:
    import: optional:file:.env[.properties]
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/goplant}
    username: ${DATABASE_USERNAME:goplant}
    password: ${DATABASE_PASSWORD:goplant}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
goplant:
  jwt:
    # Replace with a random secret of at least 32 bytes outside local development.
    secret: ${GOPLANT_JWT_SECRET}
    issuer: goplant-api
    access-token-minutes: ${GOPLANT_JWT_ACCESS_TOKEN_MINUTES:15}
  cors:
    allowed-origins: ${GOPLANT_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  auth:
    expose-verification-token: ${GOPLANT_AUTH_EXPOSE_VERIFICATION_TOKEN:false}
    require-email-verification: ${GOPLANT_AUTH_REQUIRE_EMAIL_VERIFICATION:false}
    action-token-retention-days: ${GOPLANT_AUTH_ACTION_TOKEN_RETENTION_DAYS:7}
    pending-user-retention-days: ${GOPLANT_AUTH_PENDING_USER_RETENTION_DAYS:30}
    ip-rate-limit-enabled: ${GOPLANT_AUTH_IP_RATE_LIMIT_ENABLED:true}
    ip-rate-limit-max-requests: ${GOPLANT_AUTH_IP_RATE_LIMIT_MAX_REQUESTS:25}
    ip-rate-limit-window-seconds: ${GOPLANT_AUTH_IP_RATE_LIMIT_WINDOW_SECONDS:60}
  email:
    from: ${GOPLANT_EMAIL_FROM:no-reply@goplant.local}
    verification-base-url: ${GOPLANT_PUBLIC_API_URL:}
    app-login-url: ${GOPLANT_APP_LOGIN_URL:goplantt://auth/login}
    web-login-url: ${GOPLANT_WEB_LOGIN_URL:http://localhost:8081/auth/login}
  weather:
    api-key: ${OPENWEATHER_API_KEY:}
    base-url: ${OPENWEATHER_BASE_URL:https://api.openweathermap.org}
    cache-minutes: ${GOPLANT_WEATHER_CACHE_MINUTES:30}
    min-refresh-seconds: ${GOPLANT_WEATHER_MIN_REFRESH_SECONDS:120}
