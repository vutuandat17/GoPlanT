spring:
  application:
    name: goplant-backend
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/goplant}
    username: ${DATABASE_USERNAME:goplant}
    password: ${DATABASE_PASSWORD:goplant}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
goplant:
  jwt:
    # Replace with a random secret of at least 32 bytes outside local development.
    secret: ${GOPLANT_JWT_SECRET}
    issuer: goplant-api
    access-token-minutes: ${GOPLANT_JWT_ACCESS_TOKEN_MINUTES:15}
  cors:
    allowed-origins: ${GOPLANT_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  auth:
    expose-verification-token: ${GOPLANT_AUTH_EXPOSE_VERIFICATION_TOKEN:false}
  email:
    from: ${GOPLANT_EMAIL_FROM:no-reply@goplant.local}
    verification-base-url: ${GOPLANT_PUBLIC_API_URL:}
