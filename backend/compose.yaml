services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: goplant
      POSTGRES_USER: goplant
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-goplant}
    ports:
      - "5432:5432"
    volumes:
      - goplant-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goplant -d goplant"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  goplant-postgres:
