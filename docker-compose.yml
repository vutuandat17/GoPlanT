services:
  postgres:
    image: postgres:17-alpine
    container_name: goplant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goplant}
      POSTGRES_USER: ${DATABASE_USERNAME:-goplant}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-goplant}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - goplant-postgres-data:/var/lib/postgresql/data
    networks:
      - goplant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-goplant} -d ${POSTGRES_DB:-goplant}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: goplant-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - goplant-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: goplant-backend:latest
    container_name: goplant-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-goplant}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-goplant}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-goplant}
      GOPLANT_JWT_SECRET: ${GOPLANT_JWT_SECRET:-GoPlantDockerComposeJwtSecretKey2026Minimum32BytesRequired!}
      GOPLANT_CORS_ALLOWED_ORIGINS: ${GOPLANT_CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006,http://localhost:3000}
      GOPLANT_BOOTSTRAP_ADMIN_EMAIL: ${GOPLANT_BOOTSTRAP_ADMIN_EMAIL:-admin@goplant.test}
      GOPLANT_BOOTSTRAP_ADMIN_PASSWORD: ${GOPLANT_BOOTSTRAP_ADMIN_PASSWORD:-Admin@123456}
      GOPLANT_AUTH_REQUIRE_EMAIL_VERIFICATION: ${GOPLANT_AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      GOPLANT_PUBLIC_API_URL: ${GOPLANT_PUBLIC_API_URL:-http://localhost:8082}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
    ports:
      - "8082:8080"
    networks:
      - goplant-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  frontend:
    build:
      context: ./GOPLANTT
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8082}
    image: goplant-frontend:latest
    container_name: goplant-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - goplant-network

networks:
  goplant-network:
    driver: bridge

volumes:
  goplant-postgres-data:
